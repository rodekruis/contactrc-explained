<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEA hero image v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00214D;--purple:#4F22D7;--row:#F3F4F9;--grey:#5B6B85}
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent;height:100%}
  body{font-family:'Montserrat','Inter','Segoe UI',Arial,sans-serif;color:var(--navy);display:flex;align-items:center;justify-content:center;overflow:hidden}
  #fit{width:1400px;height:1520px;transform-origin:center center}
  .stage{position:relative;width:1400px;height:1520px}
  .glow{position:absolute;left:150px;top:360px;width:1100px;height:1050px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(79,34,215,.55),rgba(79,34,215,0))}
  .card{position:absolute;background:#fff;border-radius:32px;padding:32px;box-shadow:0 30px 70px rgba(0,8,30,.45);display:flex;flex-direction:column;gap:20px}
  .head{display:flex;align-items:center;gap:16px}
  .head h3{font-size:28px;font-weight:700;line-height:1.2;flex:1}
  .chip{font-size:20px;font-weight:600;padding:6px 18px;border-radius:100px;background:var(--purple);color:#fff}
  .chip.live{background:var(--purple);color:#fff;display:flex;align-items:center;gap:10px}
  .chip.live i{width:12px;height:12px;border-radius:50%;background:#fff;display:block}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  svg{display:block}
  .ic{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* CFM */
  .channels{display:flex;justify-content:space-between}
  .ch{display:flex;flex-direction:column;align-items:center;gap:8px;width:160px;font-size:20px;font-weight:600}
  .ch .dot{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
  .ch .dot svg{width:34px;height:34px}
  .merge{height:36px;margin:-4px 0}
  .feed{display:flex;flex-direction:column;gap:12px}
  .item{display:flex;align-items:center;gap:16px;background:var(--row);border-radius:22px;padding:14px 20px}
  .sec{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
  .sec svg{width:30px;height:30px}
  .item p{flex:1;font-size:25px;font-weight:600}
  .st{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;padding:6px 16px;border-radius:100px;background:#fff;white-space:nowrap}
  .st i{width:12px;height:12px;border-radius:50%;display:block}

  /* QFA */
  .qbody{display:flex;gap:24px;align-items:center}
  .donutcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:220px}
  .legend{display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:600;color:var(--grey)}
  .legend span{display:flex;align-items:center;gap:8px}
  .legend i{width:12px;height:12px;border-radius:50%;display:block}
  .quote{display:flex;align-items:center;gap:14px;background:var(--row);border-radius:22px;padding:16px 20px;font-size:25px;font-weight:500}
  .quote em{font-style:normal;background:rgba(79,34,215,.18);border-bottom:3px solid var(--purple);padding:0 4px}
  .quote .arrow{flex:none}.qt{flex:1;white-space:nowrap}
  .tag{font-size:19px;font-weight:700;padding:6px 16px;border-radius:100px;background:var(--purple);color:#fff;white-space:nowrap}

  /* ContactRC */
  .logo{width:56px;height:56px;border-radius:18px;background:var(--purple);position:relative;flex:none}
  .logo span{position:absolute;top:50%;width:5px;border-radius:3px;background:#fff;transform:translateY(-50%)}
  .wave{background:var(--navy);border-radius:24px;height:140px;display:flex;align-items:center;gap:20px;padding:0 28px}
  .bars{flex:1;min-width:0;height:100px;display:flex;align-items:center;justify-content:center;gap:6px}
  .bars b{display:block;width:8px;border-radius:4px;transform-origin:center;animation:bar .8s ease-in-out infinite alternate,tone 4s steps(1) infinite}
  .av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
  .a1{background:#E6E8F0;color:#E6E8F0}
  .a2{background:var(--purple);color:#8E6BFF;border:3px solid #8E6BFF}
  .av::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid currentColor;opacity:0;animation:ring 4s ease-in-out infinite}
  .a2::after{animation-delay:2s;inset:-13px}
  @keyframes bar{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
  @keyframes tone{0%{background:#fff}50%{background:#8E6BFF}}
  @keyframes ring{0%{opacity:0;transform:scale(.92)}10%{opacity:1}45%{opacity:1;transform:scale(1.08)}55%,100%{opacity:0;transform:scale(1.08)}}
      .bars b{transition:height .7s cubic-bezier(.2,.8,.2,1)}
  .wave:not(.go) .bars b{height:8px!important;transform:none;background:#fff;animation:sweep 2s ease-in-out infinite!important;animation-delay:calc(var(--i)*60ms)!important;animation-duration:2s!important;animation-play-state:running}
  .wave:not(.go) .a1::after{animation:ringing 1.8s ease-out infinite!important;animation-play-state:running!important;inset:-4px}
  @keyframes sweep{0%,100%{opacity:.25;background:#fff}35%{opacity:1;background:#8E6BFF}60%{opacity:.6;background:#fff}}
  @keyframes ringing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
  .chip.live .pulse{animation-play-state:running}
  @media (prefers-reduced-motion:reduce){.bars b,.av::after{animation:none}}
  .modes{display:flex;gap:12px;justify-content:space-between}
  .mode{flex:1;display:flex;align-items:center;gap:12px;background:var(--row);border-radius:20px;padding:12px 16px;font-size:21px;font-weight:600}
  .mode .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
  .mode .dot svg{width:22px;height:22px}
  .langs{display:flex;gap:10px}
  .f{font-size:20px;font-weight:500;padding:6px 18px;border-radius:100px;background:var(--row);color:var(--grey)}

  /* QFA chat */
  .logo.spark{display:grid;place-items:center}
  .chat{min-height:250px;display:flex;flex-direction:column;gap:18px}
  .fade{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
  .fade.show{opacity:1;transform:none}
  .ubub{align-self:flex-end;max-width:520px;background:var(--purple);color:#fff;font-size:26px;font-weight:500;line-height:1.35;padding:18px 26px;border-radius:26px 26px 8px 26px}
  .ai{display:flex;gap:14px;align-items:flex-start}
  .aiav{width:52px;height:52px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
  .aibub{background:var(--row);font-size:26px;font-weight:500;line-height:1.35;padding:18px 26px;border-radius:26px 26px 26px 8px;max-width:670px;min-width:200px;min-height:72px}
  .dots{display:none;gap:8px;padding:10px 0}
  .dots.on{display:flex}
  .dots i{width:12px;height:12px;border-radius:50%;background:var(--grey);animation:dot 1s infinite;display:block}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-8px);opacity:1}}
  .pills{display:flex;gap:10px;padding-left:66px}
  .input{display:flex;align-items:center;gap:12px;border:2px solid #DADDEA;border-radius:100px;padding:10px 12px 10px 28px;font-size:22px;font-weight:500;color:var(--grey)}
  .input span{flex:1}
  .send{width:48px;height:48px;border-radius:50%;background:var(--purple);display:grid;place-items:center}

  /* QFA request + report */
  .req{display:flex;align-items:center;gap:12px;border:2px solid #DADDEA;border-radius:100px;padding:10px 10px 10px 28px;font-size:25px;font-weight:500}
  .req .rt{flex:1;white-space:nowrap}
  .caret{display:inline-block;width:3px;height:28px;background:var(--purple);vertical-align:middle;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .btn{background:var(--purple);color:#fff;font-size:21px;font-weight:700;padding:14px 26px;border-radius:100px;white-space:nowrap;transition:transform .15s,background .15s}
  .btn.press{transform:scale(.93);background:#3A14B0}
  .repwrap{position:relative;min-height:322px}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:22px;font-weight:600;color:var(--grey);opacity:0;transition:opacity .3s}
  .loading.on{opacity:1}
  .pbar{width:360px;height:12px;border-radius:100px;background:var(--row);overflow:hidden}
  .pbar b{display:block;height:100%;width:0;background:var(--purple);border-radius:100px;transition:width 1.5s ease-in-out}
  .doc{position:absolute;inset:0;border:2px solid #E3E6F0;border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s}
  .doc.show{opacity:1;transform:none}
  .dh{display:flex;align-items:center;gap:14px;margin-bottom:2px}
  .dh b{flex:1;font-size:26px;font-weight:700}
  .dico{width:42px;height:42px;border-radius:12px;background:var(--navy);display:grid;place-items:center}
  .tag.o{background:#fff;color:var(--purple);border:2px solid var(--purple)}
  .fr{display:flex;align-items:center;gap:14px;background:var(--row);border-radius:18px;padding:12px 18px}
  .fr i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700;color:var(--navy);flex:none}
  .fr p{flex:1;font-size:24px;font-weight:600}
  

  .ln{display:block;height:14px;border-radius:7px;background:#A3A9BC;transform-origin:left;transform:scaleX(0);transition:transform .7s ease-out .15s}
  .ln.t{height:18px}
  .doc.show .ln,.fr.show .ln{transform:none}
  .dh .ln{flex:none;width:34%}
  .lines{flex:1;display:flex;flex-direction:column;gap:9px}
  @media (prefers-reduced-motion:reduce){.ln{transform:none;transition:none}}

  /* CFM case list */
  .cases{display:flex;flex-direction:column;gap:12px}
  .cs{display:flex;align-items:center;gap:16px;background:var(--row);border-radius:22px;padding:14px 20px}
  .cs .sec{width:52px;height:52px}
  .cs.show .ln{transform:none}
  .asg{--c:#4F22D7;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px dashed #B7BDD0;background:transparent;transition:background .3s,border-color .3s;flex:none}
  .asg .pp{display:none;stroke:#fff}
  .asg.on{border-color:transparent;background:var(--c);animation:pop .45s}
  .asg.on .plus{display:none}.asg.on .pp{display:block}
  
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
  .stt{--t:#E6E8F0;--d:#8C94AE;width:96px;height:36px;border-radius:100px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--t);transition:background .4s;flex:none}
  .stt i{width:12px;height:12px;border-radius:50%;background:var(--d);display:block;transition:background .4s}
  .stt u{width:36px;height:8px;border-radius:4px;background:var(--d);opacity:.45;display:block;transition:background .4s}
  .stt.s-prog{--t:rgba(79,34,215,.14);--d:#4F22D7}
  .stt.s-done{--t:#4F22D7;--d:#fff}
</style>
</head>
<body>
<div id="fit"><div class="stage">
  <div class="glow"></div>

  <!-- CFM -->
  <section class="card" style="left:0;top:20px;width:800px">
    <div class="head"><div class="logo spark"><svg class="ic" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M4 7l2 2 3-3M12 8h8M4 15l2 2 3-3M12 16h8"/></svg></div><h3>Feedback Platform</h3></div>
    <div class="cases" id="cases">
      <div class="cs fade"><div class="sec" style="background:var(--navy)"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></div><div class="lines"><span class="ln t" style="width:46%"></span><span class="ln" style="width:86%"></span></div><div class="asg" style="--c:#4F22D7"><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="#8C94AE" stroke-width="2.4" stroke-linecap="round" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg><svg class="ic pp" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg></div><div class="stt s-new"><i></i><u></u></div></div>
      <div class="cs fade"><div class="sec" style="background:var(--purple)"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></div><div class="lines"><span class="ln t" style="width:58%"></span><span class="ln" style="width:70%"></span></div><div class="asg on" style="--c:#00214D"><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="#8C94AE" stroke-width="2.4" stroke-linecap="round" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg><svg class="ic pp" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg></div><div class="stt s-prog"><i></i><u></u></div></div>
      <div class="cs fade"><div class="sec" style="background:var(--navy)"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div><div class="lines"><span class="ln t" style="width:40%"></span><span class="ln" style="width:80%"></span></div><div class="asg on" style="--c:#4F22D7"><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="#8C94AE" stroke-width="2.4" stroke-linecap="round" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg><svg class="ic pp" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg></div><div class="stt s-prog"><i></i><u></u></div></div>
      <div class="cs fade"><div class="sec" style="background:var(--purple)"><svg class="ic" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.5-6 5-6s5 2.5 5 6M14 20c0-2.5 1.5-4.5 3.5-4.5S21 17.5 21 20"/></svg></div><div class="lines"><span class="ln t" style="width:52%"></span><span class="ln" style="width:64%"></span></div><div class="asg on" style="--c:#00214D"><svg class="plus" viewBox="0 0 24 24" fill="none" stroke="#8C94AE" stroke-width="2.4" stroke-linecap="round" style="width:22px;height:22px"><path d="M12 5v14M5 12h14"/></svg><svg class="ic pp" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg></div><div class="stt s-done"><i></i><u></u></div></div>
      </div>
  </section>

  <!-- QFA -->
  <section class="card" style="left:560px;top:470px;width:800px">
    <div class="head">
      <div class="logo spark"><svg class="ic" viewBox="0 0 24 24" style="width:32px;height:32px"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></div>
      <h3>Automated Analysis</h3>
    </div>
    <div class="req"><span class="rt"><span id="reqtxt"></span><span class="caret"></span></span><div class="btn" id="btn">Report</div></div>
    <div class="repwrap">
      <div class="loading" id="loading"><div class="pbar"><b id="pb"></b></div></div>
      <div class="doc" id="doc">
        <div class="dh"><div class="dico"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg></div><span class="ln t" style="width:34%"></span></div>
        <div class="fr fade"><i style="background:var(--purple);"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><rect x="3" y="7" width="18" height="11" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></svg></i><div class="lines"><span class="ln t" style="width:48%"></span><span class="ln" style="width:88%"></span></div></div>
        <div class="fr fade"><i style="background:var(--navy);"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></i><div class="lines"><span class="ln t" style="width:40%"></span><span class="ln" style="width:76%"></span></div></div>
        <div class="fr fade"><i style="background:var(--purple);"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M12 3C9 8 6 11 6 15a6 6 0 0 0 12 0c0-4-3-7-6-12z"/></svg></i><div class="lines"><span class="ln t" style="width:54%"></span><span class="ln" style="width:64%"></span></div></div>
      </div>
    </div>
  </section>

  <!-- ContactRC -->
  <section class="card" style="left:110px;top:990px;width:660px">
    <div class="head">
      <div class="logo"><span style="left:11px;height:14px"></span><span style="left:20px;height:24px"></span><span style="left:30px;height:32px"></span><span style="left:40px;height:20px"></span></div>
      <h3>Contact Center</h3>
    </div>
    <div class="wave">
      <div class="av a1"><svg class="ic" viewBox="0 0 24 24" style="stroke:#00214D;width:36px;height:36px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg></div>
      <div class="bars" id="wave"></div>
      <div class="av a2"><svg class="ic" viewBox="0 0 24 24" style="width:36px;height:36px"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19c0 2-2 3-5 3"/></svg></div>
    </div>
    <div class="modes">
      <div class="mode"><div class="dot" style="background:var(--navy)"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>Voice</div>
      <div class="mode"><div class="dot" style="background:var(--purple)"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></div>WhatsApp</div>
      <div class="mode"><div class="dot" style="background:var(--navy)"><svg class="ic" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></div>SMS</div>
    </div>
  </section>
</div></div>
<script>
  var h=[40,64,100,76,52,92,60,34,80,100,66,40,28,58,88,46,24,64,96,72,42,30,50,76,36,56,82,44,68,90,48,34];
  var w=document.getElementById('wave');
  h=h.slice(0,24);
  h.forEach(function(v,i){var b=document.createElement('b');b.style.setProperty('--i',i);b.style.height=v+'px';b.style.animationDelay=((i*137)%700)/1000+'s,0s';b.style.animationDuration=(0.55+((i*53)%50)/100)+'s,4s';w.appendChild(b);});
  var sec=134,t=document.getElementById('timer');
  function pad(n){return n<10?'0'+n:n}
  var wv=document.querySelector('.wave');
  function startCall(){wv.classList.add('go');setInterval(function(){sec++;if(t)t.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);},1000);}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){wv.classList.add('go');}else{setTimeout(startCall,6400);}

  (function(){
    var text='What can be improved in the program?';
    var rt=document.getElementById('reqtxt'),btn=document.getElementById('btn'),ld=document.getElementById('loading'),pb=document.getElementById('pb'),doc=document.getElementById('doc'),rows=doc.querySelectorAll('.fr');
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){rt.textContent=text;doc.classList.add('show');rows.forEach(function(r){r.classList.add('show')});return;}
    function run(){
      rt.textContent='';btn.classList.remove('press');ld.classList.remove('on');pb.style.transition='none';pb.style.width='0';doc.classList.remove('show');rows.forEach(function(r){r.classList.remove('show')});
      setTimeout(function(){var i=0;var iv=setInterval(function(){rt.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(iv);},45);},500);
      setTimeout(function(){btn.classList.add('press')},2300);
      setTimeout(function(){btn.classList.remove('press');ld.classList.add('on');pb.style.transition='width 1.5s ease-in-out';pb.style.width='100%';},2600);
      setTimeout(function(){ld.classList.remove('on');doc.classList.add('show');},4300);
      rows.forEach(function(r,i){setTimeout(function(){r.classList.add('show')},4700+i*350)});
      setTimeout(run,12500);
    }
    setTimeout(run,3200);
  })();
  (function(){
    var rows=[].slice.call(document.querySelectorAll('#cases .cs'));
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    function st(r,c){var e=r.querySelector('.stt');e.className='stt '+c}
    function asg(r,on){var a=r.querySelector('.asg');a.classList[on?'add':'remove']('on')}
    if(reduce){rows.forEach(function(r){r.classList.add('show')});asg(rows[0],true);st(rows[0],'s-prog');st(rows[2],'s-done');return;}
    function run(){
      rows.forEach(function(r,i){r.classList.remove('show');asg(r,i>0);});
      st(rows[0],'s-new');st(rows[1],'s-prog');st(rows[2],'s-prog');st(rows[3],'s-done');asg(rows[0],false);
      rows.forEach(function(r,i){setTimeout(function(){r.classList.add('show')},400+i*350)});
      setTimeout(function(){asg(rows[0],true);st(rows[0],'s-prog')},4500);
      setTimeout(function(){st(rows[2],'s-done')},7000);
      setTimeout(run,12000);
    }
    setTimeout(run,0);
  })();
  function fit(){var s=Math.min(innerWidth/1400,innerHeight/1520);document.getElementById('fit').style.transform='scale('+s+')';}
  fit();addEventListener('resize',fit);
</script>
</body>
